<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rahlxmd Web Pairing</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background Video -->
    <video autoplay muted loop playsinline preload="auto" class="bg-video">
        <source src="/857195-hd_1280_720_25fps.mp4" type="video/mp4">
    </video>

    <!-- Overlay -->
    <div class="overlay"></div>

    <!-- Content -->
    <div class="content">
        <div class="card">
            <h1>RAHLXMD</h1>
            <p class="subtitle">Secure Web Pairing</p>

            <input id="phone" type="text" placeholder="254712345678">

            <button type="button" onclick="generatePairing()">
                Generate Code
            </button>

            <p id="result" class="footer">
                Secure • Private • Dominant
            </p>
        </div>
    </div>

<script>
async function generatePairing() {
    console.log("Button clicked");

    const phone = document.getElementById("phone").value;

    if (!phone) {
        alert("Enter phone number");
        return;
    }

    try {
        const res = await fetch("/pair", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ phone })
        });

        const data = await res.json();

        document.getElementById("result").innerText =
            data.pairingCode || data.error;

    } catch (err) {
        console.error(err);
        alert("Server error");
    }
}
</script>

</body>
    </html>
