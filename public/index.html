<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rahlxmd Web Pairing</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background Video -->
    <video autoplay muted loop playsinline preload="auto" class="bg-video">
        <source src="/857195-hd_1280_720_25fps.mp4" type="video/mp4">
    </video>

    <!-- Overlay -->
    <div class="overlay"></div>

    <!-- Content -->
    <div class="content">
        <div class="card">
            <h1>RAHLXMD</h1>
            <p class="subtitle">Secure Web Pairing</p>

            <input id="phone" type="text" placeholder="254712345678">

            <button type="button" onclick="generatePairing()">
                Generate Code
            </button>

            <button type="button" onclick="generateQR()" style="margin-top:10px;">
                Generate QR
            </button>

            <div id="result" class="footer">
                Secure • Private • Dominant
            </div>
        </div>
    </div>

<script>
async function generatePairing() {
    const phone = document.getElementById("phone").value;
    const resultBox = document.getElementById("result");

    if (!phone) {
        alert("Enter phone number");
        return;
    }

    resultBox.innerText = "Generating pairing code...";

    try {
        const res = await fetch("/pair", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                phone: phone,
                method: "code"
            })
        });

        const data = await res.json();

        if (data.code) {
            resultBox.innerHTML =
                `<div style="font-size:22px; letter-spacing:4px; margin-top:15px;">
                    ${data.code}
                </div>`;
        } else {
            resultBox.innerText = data.error || "Error generating code";
        }

    } catch (err) {
        console.error(err);
        resultBox.innerText = "Server error";
    }
}

async function generateQR() {
    const resultBox = document.getElementById("result");

    resultBox.innerText = "Generating QR...";

    try {
        const res = await fetch("/pair", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                method: "qr"
            })
        });

        const data = await res.json();

        if (data.image) {
            resultBox.innerHTML =
                `<img src="${data.image}" style="margin-top:15px; width:220px;" />`;
        } else {
            resultBox.innerText = data.error || "Error generating QR";
        }

    } catch (err) {
        console.error(err);
        resultBox.innerText = "Server error";
    }
}
</script>

</body>
</html>
